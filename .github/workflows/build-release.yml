name: Build and manual release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch, e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'pull_request'
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
      zip_sha256: ${{ steps.build.outputs.zip_sha256 }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Validate release request
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -cne "refs/heads/$env:DEFAULT_BRANCH") { throw 'Manual releases must run on the default branch.' }
            if ($env:INPUT_VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') { throw 'Enter a strict three-part version.' }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, compress and validate
        id: build
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { '' }
          & .github/ci/Build-Package.ps1 -Version $version -Commit $env:GITHUB_SHA
      - name: Retain validated package and reports
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MainUICustomizer-${{ steps.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/ci/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ${{ github.repository }}-manual-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: dist/ci
      - name: Validate downloaded release payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          . .github/ci/Common.ps1
          [void](Assert-Package $PWD.Path (Join-Path $PWD.Path 'dist/ci') $env:RELEASE_VERSION $env:GITHUB_SHA $env:ZIP_SHA256)
      - name: Draft, upload, verify and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: node .github/ci/release.cjs
