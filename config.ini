[General]
Name = 主界面UI自定义
Description = 分别隐藏主界面UI各元素、整体缩放和调整边距
Developer = 风间千雪
File = MainUICustomizer.dll
Version = 1.0.0

[Scale]
Name = 主界面元素缩放
Description = 0.25～2.5，1为原始大小；各HUD元素分别围绕自身中心缩放，边距单独生效
Type = float
Value = 1

[MarginLeft]
Name = 主界面左边距
Description = -4000～4000，正数从原始左边界向内留白，负数向外扩展
Type = float
Value = 0

[MarginRight]
Name = 主界面右边距
Description = -4000～4000，正数从原始右边界向内留白，负数向外扩展
Type = float
Value = 0

[MarginTop]
Name = 主界面上边距
Description = -4000～4000，正数从原始上边界向内留白，负数向外扩展
Type = float
Value = 0

[MarginBottom]
Name = 主界面下边距
Description = -4000～4000，正数从原始下边界向内留白，负数向外扩展
Type = float
Value = 0

[HideAll]
Name = 隐藏主界面所有UI
Type = bool
Value = 0

[HideTopButtons]
Name = 隐藏左上角按钮组
Description = 隐藏小地图周围的派蒙、联机、元素视野、任务入口、至冬图标等按钮，保留小地图和任务追踪文字
Type = bool
Value = 0

[HideMiniMap]
Name = 隐藏小地图
Type = bool
Value = 0

[HidePaimon]
Name = 隐藏派蒙菜单入口
Type = bool
Value = 0

[HideSnezhnayaIcon]
Name = 隐藏至冬手册图标
Description = 受“隐藏左上角按钮组”控制
Type = bool
Value = 0

[HideQuestButton]
Name = 隐藏任务入口
Description = 隐藏小地图下方的感叹号旗帜图标
Type = bool
Value = 0

[HideQuestTrack]
Name = 隐藏任务追踪与指引
Description = 包括任务标题、目标图标、距离及任务提示/指引
Type = bool
Value = 0

[HideCoop]
Name = 隐藏联机入口
Type = bool
Value = 0

[HideElementalSight]
Name = 隐藏元素视野入口
Description = 隐藏主界面的元素视野入口按钮
Type = bool
Value = 0

[HideMainButtons]
Name = 隐藏右上角按钮组
Description = 隐藏右上角功能按钮，覆盖活动、背包、角色、祈愿、纪行、手册和千星奇域入口
Type = bool
Value = 0

[AlignRightButtons]
Name = 右上角剩余按钮自动右对齐
Description = 隐藏右上角部分按钮后，按原顺序向右补齐空位；关闭后还原位置
Type = bool
Value = 0

[HideMiliastraEntrance]
Name = 隐藏千星奇域入口
Description = 隐藏主界面的千星奇域入口按钮
Type = bool
Value = 0

[HideActivities]
Name = 隐藏活动入口
Type = bool
Value = 0

[HideBattlePass]
Name = 隐藏纪行入口
Type = bool
Value = 0

[HideGacha]
Name = 隐藏祈愿入口
Type = bool
Value = 0

[HideHandbook]
Name = 隐藏冒险之证入口
Type = bool
Value = 0

[HideBag]
Name = 隐藏背包入口
Type = bool
Value = 0

[HideCharacter]
Name = 隐藏角色入口
Type = bool
Value = 0

[HidePing]
Name = 隐藏网络延迟显示
Type = bool
Value = 0

[HideTeam]
Name = 隐藏队伍栏
Type = bool
Value = 0

[HideSkillPanel]
Name = 隐藏技能及操作区域
Description = 隐藏攻击、技能、跳跃、冲刺等操作按钮，不影响输入
Type = bool
Value = 0

[HideHealthBar]
Name = 隐藏底部血量与状态
Description = 隐藏底部的角色血量、等级及相关状态条
Type = bool
Value = 0

[HideChatButton]
Name = 隐藏聊天按钮
Description = 隐藏左下角聊天图标与Enter提示，不隐藏上方的消息内容显示
Type = bool
Value = 0

[HideChatPanel]
Name = 隐藏聊天面板
Description = 隐藏左下角消息内容显示区域及其背景，保留下方的聊天图标与Enter提示
Type = bool
Value = 0

[HideInteraction]
Name = 隐藏交互提示
Type = bool
Value = 0

[ToggleKey]
Name = 恢复原始界面快捷键
Description = 默认Home，再按一次恢复自定义；填入0禁用
Type = key
Value = 36

[DumpKey]
Name = 导出主界面节点快捷键
Description = 默认End，进入世界后按下，在插件目录生成ui-tree.txt，包含已隐藏节点
Type = key
Value = 35

[HiddenPaths]
Name = 自定义隐藏节点路径
Description = 从ui-tree.txt复制路径，多条用 | 分隔；支持相对主界面路径；清空后恢复
Type = string
Value =
